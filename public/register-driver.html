<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ယာဉ်မောင်း မှတ်ပုံတင်ရန်</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; }
        .del-btn { background: red; width: auto; padding: 5px 10px; font-size: 12px; }
    </style>
</head>
<body>

    <h2>ယာဉ်မောင်း မှတ်ပုံတင်ရန်</h2>

    <form id="driverForm">
        <input type="text" id="name" placeholder="ယာဉ်မောင်းအမည်" required>
        <input type="text" id="phone" placeholder="ဖုန်းနံပါတ်" required>
        <input type="text" id="car" placeholder="ကားအမျိုးအစား / နံပါတ်" required>
        <input type="text" id="image" placeholder="ဓာတ်ပုံ URL (မထည့်ပါက Default ပုံသုံးမည်)">
        <button type="submit">မှတ်ပုံတင်မည်</button>
    </form>

    <hr>

    <h3>မှတ်ပုံတင်ထားသော ယာဉ်မောင်းစာရင်း</h3>
    <ul id="driverList"></ul>

    <script>
        // ယာဉ်မောင်းစာရင်း ရယူခြင်း
        async function fetchDrivers() {
            try {
                const res = await fetch('/api/drivers');
                const drivers = await res.json();
                const list = document.getElementById('driverList');
                list.innerHTML = '';

                if(drivers.length === 0) {
                    list.innerHTML = '<li>ယာဉ်မောင်း စာရင်း မရှိသေးပါ။</li>';
                    return;
                }

                drivers.forEach(d => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div>
                            <img src="${d.image}" width="30" height="30" style="border-radius:50%; vertical-align:middle;">
                            <b>${d.name}</b> (${d.phone})<br><small>${d.car}</small>
                        </div>
                        <button class="del-btn" onclick="deleteDriver('${d.phone}')">ဖျက်မည်</button>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Error loading drivers:", err);
            }
        }

        // ဖောင်ပေးပို့ခြင်း (Register)
        document.getElementById('driverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const car = document.getElementById('car').value;
            const image = document.getElementById('image').value;

            try {
                const res = await fetch('/api/register-driver', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, car, image })
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    document.getElementById('driverForm').reset();
                    fetchDrivers();
                }
            } catch (err) {
                alert("မှတ်ပုံတင်ခြင်း မအောင်မြင်ပါ။");
            }
        });

        // ယာဉ်မောင်း ဖျက်ခြင်း (Delete)
        async function deleteDriver(phone) {
            if (!confirm("ဤယာဉ်မောင်းကို စာရင်းမှ ဖျက်ရန် သေချာပါသလား?")) return;

            try {
                const res = await fetch('/api/drivers/' + phone, {
                    method: 'DELETE'
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    fetchDrivers();
                }
            } catch (err) {
                alert("ဖျက်ရန် မအောင်မြင်ပါ။");
            }
        }

        // စာမျက်နှာပွင့်သည်နှင့် စာရင်းဆွဲထုတ်ရန်
        fetchDrivers();
    </script>
</body>
</html>
