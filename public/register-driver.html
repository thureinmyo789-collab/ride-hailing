<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration & Management</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f6f9; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { color: #333; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button.btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .driver-item { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
        .driver-info { display: flex; align-items: center; }
        .driver-info img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 12px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ယာဉ်မောင်း မှတ်ပုံတင်ရန်</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="ယာဉ်မောင်း အမည်" required>
            <input type="text" id="phone" placeholder="ဖုန်းနံပါတ် (ဥပမာ- 09xxxxxxxxx)" required>
            <input type="text" id="car" placeholder="ကားအမျိုးအစားနှင့် နံပါတ် (ဥပမာ- Alphard 1A-1234)" required>
            <input type="text" id="image" placeholder="ဓာတ်ပုံ URL (မထည့်ပါက Default ပုံသုံးမည်)">
            <button type="submit" class="btn-submit">မှတ်ပုံတင်မည်</button>
        </form>
    </div>

    <div class="card">
        <h3>မှတ်ပုံတင်ထားသော ယာဉ်မောင်းစာရင်း</h3>
        <div id="driversList">ယာဉ်မောင်းစာရင်း ရယူနေပါသည်...</div>
    </div>

    <script>
        // ယာဉ်မောင်းစာရင်း ရယူပြသခြင်း
        function loadDrivers() {
            fetch('/api/drivers')
                .then(res => res.json())
                .then(data => {
                    const listDiv = document.getElementById('driversList');
                    if (data.length === 0) {
                        listDiv.innerHTML = "<p style='text-align:center; color:gray;'>ယာဉ်မောင်း စာရင်း မရှိသေးပါ။</p>";
                        return;
                    }
                    let html = '';
                    data.forEach(d => {
                        html += `
                            <div class="driver-item">
                                <div class="driver-info">
                                    <img src="${d.image}" alt="driver">
                                    <div>
                                        <b>${d.name}</b><br>
                                        <small>ဖုန်း: ${d.phone}</small><br>
                                        <small>ကား: ${d.car}</small>
                                    </div>
                                </div>
                                <button class="btn-delete" onclick="deleteDriver('${d.phone}', '${d.name}')">ဖြုတ်မည်</button>
                            </div>
                        `;
                    });
                    listDiv.innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('driversList').innerHTML = "<p style='color:red;'>စာရင်း ရယူ၍ မရပါ</p>";
                });
        }

        // ယာဉ်မောင်း အသစ် မှတ်ပုံတင်ခြင်း
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const driverData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                car: document.getElementById('car').value,
                image: document.getElementById('image').value
            };

            fetch('/api/register-driver', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(driverData)
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                if (res.success) {
                    document.getElementById('registerForm').reset();
                    loadDrivers(); // စာရင်း အသစ်ပြန်တင်မည်
                }
            });
        });

        // ယာဉ်မောင်းကို စာရင်းမှ ဖြုတ်ပစ်ခြင်း (Delete)
        function deleteDriver(phone, name) {
            if (confirm(`${name} ကို စာရင်းမှ ဖြုတ်ပစ်ရန် သေချာပါသလား?`)) {
                fetch(`/api/delete-driver/${phone}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(res => {
                        alert(res.message);
                        if (res.success) {
                            loadDrivers(); // စာရင်း အသစ်ပြန်တင်မည်
                        }
                    });
            }
        }

        // စာမျက်နှာ စဖွင့်ချိန်တွင် စာရင်းယူမည်
        loadDrivers();
    </script>
</body>
</html>
