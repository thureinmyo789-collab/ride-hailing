<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .info-box { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        #status { font-weight: bold; color: #007bff; }
        .finish-btn { margin-top: 10px; padding: 8px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; display: none; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
</head>
<body>
    <div class="info-box">
        <h3>Driver Dashboard</h3>
        <p id="status">ခရီးသည်များကို စောင့်ဆိုင်းနေသည်...</p>
        <button id="finish-ride-btn" class="finish-btn" onclick="finishRide()">ခရီးစဉ် ပြီးဆုံးပြီ (Finish)</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        var map = L.map('map').setView([21.9833, 100.0833], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        var socket = io();
        var passengersMarkers = {};
        var driverMarker = null;
        var routingControl = null;
        var activePassengerId = null;
        var targetLat = null, targetLng = null;
        var arrivedAlerted = false;

        var driverLat = 21.67184;
        var driverLng = 100.02042;

        // ယာဉ်မောင်းမားကာ (ဒီမားကာသည် ခရီးစဉ်ပြီးဆုံးသည်ဖြစ်စေ ဘယ်တော့မှ ပျောက်မသွားပါ)
        driverMarker = L.marker([driverLat, driverLng], {
            icon: L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41]
            })
        }).addTo(map).bindPopup("<b>သင့်တည်နေရာ (ယာဉ်မောင်း)</b>");

        function playAlertVoice(text) {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'my-MM';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        socket.on('liveLocationUpdate', (data) => {
            var pId = data.id;
            var pLat = data.lat;
            var pLng = data.lng;

            if (!passengersMarkers[pId]) {
                var marker = L.marker([pLat, pLng]).addTo(map)
                    .bindPopup(`<b>ခရီးသည် တည်နေရာ</b><br><button onclick="acceptSpecificRide('${pId}', ${pLat}, ${pLng})" style='padding:5px 10px; background:#007bff; color:white; border:none; border-radius:3px; cursor:pointer;'>ဤခရီးစဉ်ကို လက်ခံမည်</button>`);
                passengersMarkers[pId] = marker;
            } else {
                passengersMarkers[pId].setLatLng([pLat, pLng]);
            }
        });

        window.acceptSpecificRide = function(passengerId, pLat, pLng) {
            activePassengerId = passengerId;
            targetLat = pLat;
            targetLng = pLng;
            arrivedAlerted = false;

            socket.emit('acceptRide', { passengerId: passengerId, message: 'ယာဉ်မောင်းမှ သင့်ခရီးစဉ်ကို လက်ခံလိုက်ပါပြီ။' });
            document.getElementById('status').innerText = 'ခရီးစဉ် လက်ခံထားပါသည်။ လမ်းကြောင်းပြနေသည်...';
            document.getElementById('finish-ride-btn').style.display = 'block';

            if (routingControl) { map.removeControl(routingControl); }
            routingControl = L.Routing.control({
                waypoints: [L.latLng(driverLat, driverLng), L.latLng(pLat, pLng)],
                routeWhileDragging: false,
                language: 'my'
            }).addTo(map);

            startDriverTracking();
        };

        function startDriverTracking() {
            setInterval(() => {
                if (!targetLat || !targetLng) return;

                driverLat += (targetLat - driverLat) * 0.1;
                driverLng += (targetLng - driverLng) * 0.1;

                if (driverMarker) {
                    driverMarker.setLatLng([driverLat, driverLng]);
                }

                socket.emit('driverLocationUpdate', { lat: driverLat, lng: driverLng, passengerId: activePassengerId });

                if (routingControl) {
                    routingControl.setWaypoints([
                        L.latLng(driverLat, driverLng),
                        L.latLng(targetLat, targetLng)
                    ]);
                }

                var distance = Math.abs(driverLat - targetLat) + Math.abs(driverLng - targetLng);
                if (distance < 0.0005 && !arrivedAlerted) {
                    arrivedAlerted = true;
                    playAlertVoice("ကားဆရာ ရောက်ရှိပါပြီ");
                    socket.emit('driverArrived', { passengerId: activePassengerId });
                }
            }, 3000);
        }

        // ယာဉ်မောင်းဘက်မှ ခရီးစဉ် ပြီးဆုံးကြောင်း နှိပ်ခြင်း (ခရီးသည် မားကာနှင့် လမ်းကြောင်းသာ ပျောက်မည်)
        window.finishRide = function() {
            if (activePassengerId) {
                socket.emit('finishRide', { passengerId: activePassengerId });
                
                // ခရီးသည် မားကာကိုသာ ဖျက်ခြင်း (ယာဉ်မောင်း မားကာ ဆက်ရှိနေမည်)
                if (passengersMarkers[activePassengerId]) {
                    map.removeLayer(passengersMarkers[activePassengerId]);
                    delete passengersMarkers[activePassengerId];
                }
                if (routingControl) {
                    map.removeControl(routingControl);
                    routingControl = null;
                }
                document.getElementById('status').innerText = 'ခရီးစဉ် ပြီးဆုံးသွားပါပြီ။ အခြားခရီးသည်များကို စောင့်ဆိုင်းနေသည်...';
                document.getElementById('finish-ride-btn').style.display = 'none';
                activePassengerId = null;
                targetLat = null;
                targetLng = null;
            }
        };

        socket.on('removePassengerMarker', (data) => {
            if (passengersMarkers[data.passengerId]) {
                map.removeLayer(passengersMarkers[data.passengerId]);
                delete passengersMarkers[data.passengerId];
            }
        });
    </script>
</body>
</html>
