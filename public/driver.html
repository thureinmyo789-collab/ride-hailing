<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .info-box { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        #status { font-weight: bold; color: #007bff; margin-top: 5px; }
    </style>
</head><!-- Leaflet Routing Machine CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<body>
    <div class="info-box">
        <h3>Driver Dashboard</h3>
        <p id="status">ခရီးသည်တည်နေရာကို စောင့်ဆိုင်းနေသည်...</p>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Socket.io -->

<!-- Leaflet Routing Machine JS -->
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<!-- Socket.io -->
<script src="/socket.io/socket.io.js"></script>
    <script>
        // Map Initialize
        var map = L.map('map').setView([21.9833, 100.0833], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        var marker = null;
        var socket = io();

        // အချက်ပေးအသံ (Beep)
        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        // ခရီးသည်ဘက်မှ ပို့လိုက်သော တည်နေရာကို လက်ခံရယူခြင်း (Event name ကို match လုပ်ထားသည်)
        socket.on('liveLocationUpdate', function(data) {
            playBeep();
            console.log("Received location:", data);
            var lat = data.lat;
            var lng = data.lng; // index.html တွင် lng ဟုသုံးထားသဖြင့် lng သုံးရန်

            document.getElementById('status').innerText = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;

            if (!marker) {
                marker = L.marker([lat, lng]).addTo(map).bindPopup("ခရီးသည်ရှိရာနေရာ").openPopup();
            } else {
                marker.setLatLng([lat, lng]);
            }
            map.setView([lat, lng], 16);
        });let routingControl = null;

// ခရီးသည် marker ပေါ်လာပြီး နှိပ်သည့်အခါ လမ်းကြောင်းပြရန်
if (typeof passengerMarker !== 'undefined' && passengerMarker) {
    passengerMarker.on('click', function() {
        socket.emit('acceptRide', { driverId: socket.id });
        alert('ခေါ်ဆိုမှုကို လက်ခံလိုက်ပါပြီ။ လမ်းကြောင်း စတင်ပြသနေပါပြီ။');

        // ယာဉ်မောင်း လက်ရှိနေရာ (သို့မဟုတ် ယာဉ်မောင်း GPS နေရာကို ယူသုံးရန်)
        let driverLat = 21.67184; // လိုအပ်ပါက မိမိလက်ရှိ lat ထည့်ရန်
        let driverLng = 100.02042; // လိုအပ်ပါက မိမိလက်ရှိ lng ထည့်ရန်

        let pLatLng = passengerMarker.getLatLng();

        if (routingControl) {
            map.removeControl(routingControl);
        }
        
        routingControl = L.Routing.control({
            waypoints: [
                L.latLng(driverLat, driverLng), 
                L.latLng(pLatLng.lat, pLatLng.lng) 
            ],
            routeWhileDragging: false,
            language: 'my'
        }).addTo(map);
    });
}
// ခရီးသည်တည်နေရာ လက်ခံရရှိသည့်အခါ မားကာပြသခြင်းနှင့် နှိပ်၍လက်ခံခြင်း
socket.on('liveLocationUpdate', (data) => {
    var passengerLat = data.lat;
    var passengerLng = data.lng;

    // ခရီးသည်အတွက် မားကာပြသရန်
    var passengerMarker = L.marker([passengerLat, passengerLng]).addTo(map)
        .bindPopup("<b>ခရီးသည် တည်နေရာ</b><br>နှိပ်၍ ခရီးစဉ်ကို လက်ခံပါ။").openPopup();

    // မားကာကို နှိပ်လိုက်သောအခါ ယာဉ်မောင်းမှ ခရီးစဉ်လက်ခံခြင်း
    passengerMarker.on('click', () => {
        // ဆာဗာသို့ rideAccepted / acceptRide ပို့ရန်
        socket.emit('acceptRide', { driverId: socket.id, message: 'ယာဉ်မောင်းမှ ခရီးစဉ်ကို လက်ခံလိုက်ပါပြီ။' });

        // လမ်းကြောင်းပြစနစ် (Leaflet Routing Machine) စတင်ရန်
        // (ယာဉ်မောင်းလက်ရှိနေရာမှ ခရီးသည်နေရာသို့)
        if (typeof L.Routing !== 'undefined') {
            L.Routing.control({
                waypoints: [
                    L.latLng(currentDriverLat, currentDriverLng), // ယာဉ်မောင်းလက်ရှိနေရာ
                    L.latLng(passengerLat, passengerLng)        // ခရီးသည်နေရာ
                ],
                routeWhileDragging: true
            }).addTo(map);
        }
    });
});

// ခရီးသည်ဘက်တွင် ယာဉ်မောင်းလက်ခံကြောင်း ပြသရန်
socket.on('rideAccepted', (data) => {
    alert(data.message);
});
    </script>
</body>
</html>
