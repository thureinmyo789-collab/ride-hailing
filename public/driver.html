<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .info-box { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="info-box">
        <h3>Driver Dashboard</h3>
        <p id="status">ခရီးသည်တည်နေရာကို စောင့်ဆိုင်းနေသည်...</p>
    </div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Map Initialize
        var map = L.map('map').setView([21.67, 100.02], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        var marker = null;
        var socket = io();

        // ခရီးသည်ဘက်မှ ပို့လိုက်သော တည်နေရာကို လက်ခံရယူခြင်း
        socket.on('locationUpdate', function(data) {
            console.log("Received location:", data);
            var lat = data.lat;
            var lon = data.lon;

            document.getElementById('status').innerText = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;

            if (marker) {
                marker.setLatLng([lat, lon]);
            } else {
                marker = L.marker([lat, lon]).addTo(map);
            }
            map.setView([lat, lon], map.getZoom());
        });
    </script>
</body>
</html>
