<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ခရီးသည် တည်နေရာပို့ပေးခြင်း</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
        #map { height: 70vh; width: 100%; }
        .panel { padding: 15px; background: #fff; }
        button { padding: 12px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #status { font-weight: bold; margin-top: 10px; color: #333; }
        #coords { font-size: 14px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <button onclick="startSharing()">တည်နေရာ စတင်မျှဝေမည်</button>
        <div id="status">အခြေအနေ: တည်နေရာ မပို့ရသေးပါ</div>
        <div id="coords">Lat: -, Lng: -</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        var map = L.map('map').setView([21.9833, 100.0833], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        var socket = io();
        var myMarker = null;
        var driverMarker = null;

        function playAlertVoice(text) {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'my-MM';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startSharing() {
            if (navigator.geolocation) {
                document.getElementById('status').innerText = "အခြေအနေ: တည်နေရာ ယူနေပါပြီ...";
                navigator.geolocation.watchPosition((position) => {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;

                    if (!myMarker) {
                        myMarker = L.marker([lat, lng]).addTo(map).bindPopup("သင့်တည်နေရာ").openPopup();
                        map.setView([lat, lng], 16);
                    } else {
                        myMarker.setLatLng([lat, lng]);
                    }

                    document.getElementById('coords').innerText = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
                    socket.emit('liveLocationUpdate', { lat: lat, lng: lng });
                    document.getElementById('status').innerText = "အခြေအနေ: တည်နေရာ မျှဝေနေပါပြီ";
                }, (error) => {
                    alert("တည်နေရာရယူ၍ မရပါ: " + error.message);
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
            } else {
                alert("ဒီဘရောက်ဇာမှ တည်နေရာရှာဖွေမှုကို မထောက်ပံ့ပါ။");
            }
        }

        socket.on('rideAccepted', (data) => {
            document.getElementById('status').innerText = data.message;
        });

        socket.on('driverLocationUpdate', (data) => {
            if (!driverMarker) {
                driverMarker = L.marker([data.lat, data.lng], {
                    icon: L.icon({
                        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41]
                    })
                }).addTo(map).bindPopup("<b>ယာဉ်မောင်း လာနေပါပြီ</b>").openPopup();
            } else {
                driverMarker.setLatLng([data.lat, data.lng]);
            }
        });

        socket.on('driverArrived', (data) => {
            playAlertVoice("ကားဆရာ ရောက်ရှိပါပြီ");
            document.getElementById('status').innerText = "ကားဆရာ ရောက်ရှိပါပြီ!";
        });

        socket.on('rideFinished', (data) => {
            if (driverMarker) {
                map.removeLayer(driverMarker);
                driverMarker = null;
            }
            document.getElementById('status').innerText = "ခရီးစဉ် ပြီးဆုံးသွားပါပြီ။";
        });
    </script>
</body>
</html>
