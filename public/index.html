<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ခရီးသည် တည်နေရာပို့ပေးခြင်း</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
        #map { height: 60vh; width: 100%; }
        .panel { padding: 15px; background: #fff; max-height: 35vh; overflow-y: auto; }
        button { padding: 10px 15px; font-size: 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        #status { font-weight: bold; margin-top: 10px; color: #333; }
        #coords { font-size: 14px; color: #555; margin-top: 5px; }
        .search-box { margin-bottom: 10px; }
        .search-box input { padding: 8px; width: 70%; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .driver-card { display: flex; align-items: center; background: #f9f9f9; border: 1px solid #ddd; padding: 10px; margin-top: 8px; border-radius: 8px; text-align: left; position: relative; }
        .driver-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
        .driver-info { flex-grow: 1; font-size: 13px; }
        /* အွန်လိုင်းအခြေအနေ ပြသသည့် အစိမ်း/အနီ အစက်ကလေးများ[span_1](start_span)[span_1](end_span) */
        .status-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background-color: #28a745; box-shadow: 0 0 5px #28a745; }
        .status-offline { background-color: #dc3545; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <div class="search-box"><div style="margin-bottom: 10px; padding: 8px; background: #f9f9f9; border-radius: 6px;">
    <h4 style="margin: 0 0 5px 0; font-size: 14px; color: #333;">ခရီးသည် သတင်းအချက်အလက်</h4>
    <input type="tel" id="passengerPhone" placeholder="ဖုန်းနံပါတ် ရိုက်ထည့်ပါ (ဥပမာ 09...)" style="width: 100%; padding: 6px; box-sizing: border-box; font-size: 14px;" />
    <p id="passenger-status" style="margin: 5px 0 0 0; font-size: 13px; color: #007bff; font-weight: bold;">ယာဉ်မောင်း ရွေးချယ်ခေါ်ယူပါ...</p>
</div>

            <input type="text" id="destinationInput" placeholder="သွားမည့်နေရာ (သို့) ဟိုတယ်နာမည် ရိုက်ထည့်ပါ...">
            <button onclick="searchDestination()">ရှာမည်</button>
        </div>
        <button onclick="refreshLocation()" style="background: #28a745;"> မိမိတည်နေရာကိုရှာမည်</button>        <div id="status">အခြေအနေ: တည်နေရာ မပို့ရသေးပါ</div>
        <div id="coords">Lat: -, Lng: -</div>
        <div id="driversList"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        var map = L.map('map').setView([21.9833, 100.0833], 15);

        // Google Hybrid Map (ဂြိုလ်တုပုံရိပ် + လမ်းနှင့် နေရာအမည်များ)
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);
        var socket = io();
        var myMarker = null;
        var driverMarker = null;
        var destMarker = null;
        var isSharing = false;
        var currentLat = null;
        var currentLng = null;
        var destLat = null;
        var destLng = null;
// ၁။ ခရီးသည် ဖုန်းနံပါတ် ရယူခြင်း
function getPassengerPhone() {
    let inputElem = document.getElementById('passengerPhone');
    if (inputElem && inputElem.value.trim() !== "") {
        localStorage.setItem('passengerPhone', inputElem.value.trim());
        return inputElem.value.trim();
    }
    let savedPhone = localStorage.getItem('passengerPhone');
    if (savedPhone) return savedPhone;
    return "09893436897"; // အရေးပေါ် ယာယီနံပါတ်
}


// ၂။ ယာဉ်မောင်းအား ခေါ်ယူသည့် Function ပြင်ဆင်ခြင်း
function selectDriver(driverId) {
    let passengerPhone = getPassengerPhone();
    if (!passengerPhone) {
        alert("ကျေးဇူးပြု၍ ဖုန်းနံပါတ် အရင်ရိုက်ထည့်ပါ!");
        return;
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            // Socket မှတစ်ဆင့် ယာဉ်မောင်းထံ ဖုန်းနံပါတ်နှင့် Location ပို့မည်
            socket.emit('requestRide', {
                driverId: driverId,
                passengerPhone: passengerPhone,
                lat: lat,
                lng: lng
            });

            document.getElementById('passenger-status').innerText = "ယာဉ်မောင်းထံ ခေါ်ယူမှု ပို့ပြီးပါပြီ။ စောင့်ဆိုင်းပေးပါ...";
        }, err => {
            alert("သင့် တည်နေရာ (GPS) ကို ရယူ၍ မရပါ: " + err.message);
        });
    }
}

// ၃။ ယာဉ်မောင်းက ခရီးစဉ် လက်ခံလိုက်သည့်အခါ အသိပေးချက်နှင့် Marker ပြသခြင်း
socket.on('rideAccepted', (data) => {
    document.getElementById('passenger-status').innerText = "ကျေးဇူးပြု၍ ခဏစောင့်ပါ၊ ယာဉ်မောင်း လာနေပါသည်။";
    
    // ယာဉ်မောင်း၏ တည်နေရာ Marker ကို တိတိကျကျ ပြသပေးခြင်း
    if (data.driverLat && data.driverLng) {
        updateDriverMarkerOnMap(data.driverLat, data.driverLng);
    }
});

// ၄။ ယာဉ်မောင်းက ခရီးစဉ် ပြီးဆုံးကြောင်း နှိပ်လိုက်သည့်အခါ Marker စာရင်းများ ရှင်းလင်းခြင်း
socket.on('rideCompleted', () => {
    document.getElementById('passenger-status').innerText = "ခရီးစဉ် ပြီးဆုံးပါပြီ။ ကျေးဇူးတင်ပါသည်။";
    clearDriverMarkers();
});
        
        // လက်ရှိ အွန်လိုင်းပေါ်ရှိ ယာဉ်မောင်းဖုန်းနံပါတ်များကို သိမ်းဆည်းရန်
        var onlineDriversMap = {};
        function refreshLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;

                    if (!myMarker) {
                        myMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}</span>`).openPopup();
                        map.setView([currentLat, currentLng], 17);
                    } else {
                        myMarker.setLatLng([currentLat, currentLng]);
                        myMarker.setPopupContent(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}</span>`);
                        map.setView([currentLat, currentLng], 17);
                    }

                    document.getElementById('coords').innerText = `Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}`;
                    alert("သင့်တည်နေရာကို အောင်မြင်စွာ ရယူပြီးပါပြီ။");
                }, (error) => {
                    alert("တည်နေရာရယူ၍ မရသေးပါ။ GPS ဖွင့်ထားခြင်း ရှိမရှိ စစ်ဆေးပါ။");
                }, { enableHighAccuracy: true, timeout: 10000 });
            }
        }

        // ဆာဗာမှ အွန်လိုင်းအခြေအနေ အပြောင်းအလဲကို လက်ခံရယူခြင်း[span_2](start_span)[span_2](end_span)
        socket.on('updateDriverStatus', (data) => {
            if (data && data.phone) {
                if (data.status === 'online') {
                    onlineDriversMap[data.phone] = true;
                } else {
                    delete onlineDriversMap[data.phone];
                }
                fetchDrivers(); // စာရင်းကို အလိုအလျောက် အပ်ဒိတ်လုပ်ပြမည်
            }
        });

        // ယာဉ်မောင်းအတွက် အနီရောင် မားကာ
        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        function playAlertVoice(text) {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'my-MM';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ခရီးသည်လင့်ခ်ထဲ ဝင်ဝင်ချင်း GPS ပိတ်ထားပါက ဖွင့်ခိုင်းရန် စစ်ဆေးခြင်း
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                // GPS ဖွင့်ပြီးသားဖြစ်ပါက အလုပ်လုပ်မည်
            }, (error) => {
                alert("ကျေးဇူးပြု၍ ဖုန်း၏ Location (GPS) ကို ဖွင့်ပေးပါ။");
            }, { timeout: 10000 });

            navigator.geolocation.watchPosition((position) => {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;

                if (!myMarker) {
                    myMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}</span>`).openPopup();
                    map.setView([currentLat, currentLng], 17);
                } else {
                    myMarker.setLatLng([currentLat, currentLng]);
                    myMarker.setPopupContent(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}</span>`);
                }

                document.getElementById('coords').innerText = `Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}`;

                if (isSharing) {
                    socket.emit('liveLocationUpdate', { lat: currentLat, lng: currentLng, destLat: destLat, destLng: destLng });
                }
            }, (error) => {
                console.error("Passenger GPS Error: " + error.message);
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        } else {
            alert("ဒီဘရောက်ဇာမှ တည်နေရာရှာဖွေမှုကို မထောက်ပံ့ပါ။");
        }

        // မြေပုံပေါ်တွင် နေရာထောက်၍ သွားမည့်နေရာ သတ်မှတ်ခြင်း
        map.on('click', function(e) {
            destLat = e.latlng.lat;
            destLng = e.latlng.lng;
            if (!destMarker) {
                destMarker = L.marker([destLat, destLng], {draggable: true}).addTo(map).bindPopup("သွားမည့်နေရာ").openPopup();
            } else {
                destMarker.setLatLng([destLat, destLng]);
            }
            fetchDrivers();
        });

        // Search ဖြင့် နေရာရှာဖွေခြင်း (Nominatim API)
        function searchDestination() {
            let query = document.getElementById('destinationInput').value;
            if (!query) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        destLat = parseFloat(data[0].lat);
                        destLng = parseFloat(data[0].lon);
                        map.setView([destLat, destLng], 16);
                        if (!destMarker) {
                            destMarker = L.marker([destLat, destLng]).addTo(map).bindPopup(data[0].display_name).openPopup();
                        } else {
                            destMarker.setLatLng([destLat, destLng]).setPopupContent(data[0].display_name).openPopup();
                        }
                        fetchDrivers();
                    } else {
                        alert("မတွေ့ရှိပါ။ အခြားအမည်ဖြင့် ထပ်ရှာပါ။");
                    }
                });
        }

        // ဆာဗာမှ ယာဉ်မောင်းစာရင်းနှင့် အွန်လိုင်းအခြေအနေ ထုတ်ယူပြသခြင်း[span_3](start_span)[span_3](end_span)
        function fetchDrivers() {
            // ပထမဦးစွာ ဆာဗာရှိ အွန်လိုင်း ယာဉ်မောင်းစာရင်းကို ရယူပါ
            fetch('/api/online-drivers')
                .then(res => res.json())
                .then(onlineList => {
                    onlineDriversMap = onlineList; // { phone: socket.id }
                    
                    // ထို့နောက် ယာဉ်မောင်းအားလုံးစာရင်းကို ဆက်ယူပါ
                    return fetch('/api/drivers');
                })
                .then(res => res.json())
                .then(drivers => {
                    let listDiv = document.getElementById('driversList');
                    listDiv.innerHTML = "<h4>ယာဉ်မောင်း ရွေးချယ်ရန်</h4>";
                    
                    drivers.forEach(d => {
                        // ယာဉ်မောင်း အွန်လိုင်းဝင်ထားခြင်း ရှိမရှိ စစ်ဆေးခြင်း
                        let isOnline = onlineDriversMap && onlineDriversMap[d.phone];
                        let statusClass = isOnline ? "status-dot status-online" : "status-dot status-offline";
                        let statusText = isOnline ? "Online (အစိမ်းရောင်)" : "Offline (အနီရောင်)";
                        
                        // အကယ်၍ Offline ဆိုလျှင် ခေါ်ဆိုခွင့် ခလုတ်ကို ပိတ်ထားရန် သို့မဟုတ် အသိပေးရန်
                        let btnDisabled = !isOnline ? "disabled style='background:gray; cursor:not-allowed;'" : "";

                        listDiv.innerHTML += `
                            <div class="driver-card">
                                <img src="${d.image}" alt="Driver">
                                <div class="driver-info">
                                    <span class="${statusClass}" title="${statusText}"></span><b>${d.name}</b><br>
                                    ဖုန်း: <a href="tel:${d.phone}">${d.phone}</a><br>
                                    ကား: ${d.car}
                                </div>
                                <button ${btnDisabled} onclick="selectDriver('${d.phone}', '${d.name}', '${d.car}', ${!!isOnline})">ခေါ်မည်</button>
                            </div>
                        `;
                    });
                });
        }

        // မျက်နှာပြင် စတင်ဖွင့်ချိန်တွင် ယာဉ်မောင်းစာရင်းကို ဝင်ဆွဲရန်
        fetchDrivers();

        function selectDriver(phone, name, car, isOnline) {
            if (!isOnline) {
                alert(name + " သည် လက်စလက်ထက် အင်တာနက်ဖွင့်ပြီး driver.html ထဲတွင် မရှိသေးပါ (Offline ဖြစ်နေပါသည်)။ ၎င်းအား ခေါ်ဆို၍ မရပါ။");
                return;
            }
            if (!currentLat || !currentLng) {
                alert("သင့်လက်ရှိ တည်နေရာ မရသေးပါ။ ခဏစောင့်ပါ။");
                return;
            }
            isSharing = true;
            document.getElementById('status').innerText = "အခြေအနေ: တည်နေရာ မျှဝေနေပါပြီ (" + name + " ကို ခေါ်ဆိုနေသည်)";
            
            // သီးသန့်ယာဉ်မောင်းထံသို့ ringtone အသံမြည်စေရန် targetDriverPhone ဖြင့် ပို့ဆောင်ခြင်း[span_4](start_span)[span_4](end_span)
        socket.emit('passengerRequestRide', {
    lat: currentLat,
    lng: currentLng,
    destLat: destLat,
    destLng: destLng,
    passengerPhone: document.getElementById('passengerPhone').value,
    passengerName: "ခရီးသည်",
    targetDriverPhone: phone,
    driverPhone: phone,
    driverName: name,
    carInfo: car
});




            alert(name + " ထံသို့ ကားခေါ်ဆိုမှု ပို့လိုက်ပါပြီ။ ဖုန်း Ringtone အသံမြည်လာပါလိမ့်မည်။");
        }

        function startSharing() {
            if (currentLat && currentLng) {
                isSharing = true;
                document.getElementById('status').innerText = "အခြေအနေ: တည်နေရာ မျှဝေနေပါပြီ";
                socket.emit('liveLocationUpdate', { lat: currentLat, lng: currentLng, destLat: destLat, destLng: destLng });
            } else {
                alert("တည်နေရာ ရှာမတွေ့သေးပါ။");
            }
        }

        // ယာဉ်မောင်းမှ လက်ခံကြောင်း စာသားပြသခြင်း
        socket.on('rideAccepted', (data) => {
            document.getElementById('status').innerText = data.message;
            playAlertVoice("ယာဉ်မောင်းမှ ခရီးစဉ်ကို လက်ခံလိုက်ပါပြီ");
        });

        // ယာဉ်မောင်း တည်နေရာ ရွေ့လျားမှုကို အနီရောင်မားကာဖြင့် ခရီးသည်ဘက်တွင် ပြသခြင်း
        socket.on('driverLocationUpdate', (data) => {
            if (!driverMarker) {
                driverMarker = L.marker([data.lat, data.lng], { icon: redIcon })
                    .addTo(map)
                    .bindPopup(`<b>ယာဉ်မောင်း လာနေပါပြီ</b><br><span style="font-size:12px; color:gray;">Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)}</span>`)
                    .openPopup();
            } else {
                driverMarker.setLatLng([data.lat, data.lng]);
                driverMarker.setPopupContent(`<b>ယာဉ်မောင်း လာနေပါပြီ</b><br><span style="font-size:12px; color:gray;">Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)}</span>`);
            }
        });

        // ရောက်ရှိလာပါက အသံမြည်ခြင်း
        socket.on('driverArrived', (data) => {
            playAlertVoice("ကားဆရာ ရောက်ရှိပါပြီ");
            document.getElementById('status').innerText = "ကားဆရာ ရောက်ရှိပါပြီ!";
        });

        socket.on('rideFinished', (data) => {
            if (driverMarker) {
                map.removeLayer(driverMarker);
                driverMarker = null;
            }
            document.getElementById('status').innerText = "ခရီးစဉ် ပြီးဆုံးသွားပါပြီ။";
        });
    </script>
</body>
</html>
