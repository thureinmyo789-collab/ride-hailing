<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 80vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: sans-serif; text-align: center; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 10px; }
        #status { font-weight: bold; color: #333; margin: 10px; }
    </style>
</head>
<body>
    <h2>ခရီးသည် တည်နေရာပြ စနစ်</h2>
    <p id="status">တည်နေရာ စတင်ရှာဖွေနေသည်...</p>
    <button class="btn" onclick="sendLocation()">တည်နေရာ စတင်မျှဝေမည်</button>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        var map = L.map('map').setView([21.9833, 100.0833], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        var socket = io();
        var myMarker = null;
        var driverMarker = null;
        var watchId = null;

        function playAlertVoice(text) {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'my-MM';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function sendLocation() {
            if (navigator.geolocation) {
                document.getElementById('status').innerText = "တည်နေရာ မျှဝေနေပါပြီ...";
                watchId = navigator.geolocation.watchPosition((position) => {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;

                    if (!myMarker) {
                        myMarker = L.marker([lat, lng]).addTo(map).bindPopup("သင့်တည်နေရာ").openPopup();
                        map.setView([lat, lng], 16);
                    } else {
                        myMarker.setLatLng([lat, lng]);
                    }

                    // ဆာဗာသို့ တည်နေရာ အဉ်တိတ်ပို့ခြင်း (Background မှာပါ ဆက်တပို့ရန်)
                    socket.emit('liveLocationUpdate', { lat: lat, lng: lng });
                }, (error) => {
                    alert("တည်နေရာယူ၍ မရပါ: " + error.message);
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
            } else {
                alert("Geolocation ကို သင့်ဘရောက်ဇာမှ မထောက်ပံ့ပါ။");
            }
        }

        // ယာဉ်မောင်း လက်ခံကြောင်း အကြောင်းကြားခြင်း
        socket.on('rideAccepted', (data) => {
            document.getElementById('status').innerText = data.message;
        });

        // ယာဉ်မောင်း တည်နေရာကို လက်ခံပြသခြင်း
        socket.on('driverLocationUpdate', (data) => {
            if (!driverMarker) {
                driverMarker = L.marker([data.lat, data.lng], {
                    icon: L.icon({
                        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41]
                    })
                }).addTo(map).bindPopup("<b>ယာဉ်မောင်း လာနေပါပြီ</b>").openPopup();
            } else {
                driverMarker.setLatLng([data.lat, data.lng]);
            }
        });

        // ယာဉ်မောင်း ရောက်ရှိလာပါက အသံမြည်ခြင်း
        socket.on('driverArrived', (data) => {
            playAlertVoice("ကားဆရာ ရောက်ရှိပါပြီ");
            document.getElementById('status').innerText = "ကားဆရာ ရောက်ရှိပါပြီ!";
        });

        socket.on('rideFinished', (data) => {
            if (driverMarker) {
                map.removeLayer(driverMarker);
                driverMarker = null;
            }
            document.getElementById('status').innerText = "ခရီးစဉ် ပြီးဆုံးသွားပါပြီ။";
        });
    </script>
</body>
</html>
