<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ခရီးသည် တည်နေရာပို့ပေးခြင်း</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
        #map { height: 70vh; width: 100%; }
        .panel { padding: 15px; background: #fff; }
        button { padding: 12px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #status { font-weight: bold; margin-top: 10px; color: #333; }
        #coords { font-size: 14px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <button onclick="startSharing()">တည်နေရာ စတင်မျှဝေမည်</button>
        <div id="status">အခြေအနေ: တည်နေရာ မပို့ရသေးပါ</div>
        <div id="coords">Lat: -, Lng: -</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
                var map = L.map('map').setView([21.9833, 100.0833], 15);

        // Google Hybrid Map (ဂြိုလ်တုပုံရိပ် + လမ်းနှင့် နေရာအမည်များ)
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);
        var socket = io();
        var myMarker = null;
        var driverMarker = null;
        var isSharing = false;

        // ယာဉ်မောင်းအတွက် အနီရောင် မားကာ
        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        function playAlertVoice(text) {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'my-MM';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ခရီးသည်လင့်ခ်ထဲ ဝင်ဝင်ချင်း ကိုယ့်တည်နေရာကို Realtime ခြေရာခံပြသပေးခြင်း (အဆက်အသွယ်မရှိသေးချိန်လည်း မြင်ရရန်)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;

                if (!myMarker) {
                    myMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}</span>`).openPopup();
                    map.setView([lat, lng], 17);
                } else {
                    myMarker.setLatLng([lat, lng]);
                    myMarker.setPopupContent(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}</span>`);
                }

                document.getElementById('coords').innerText = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;

                // တည်နေရာမျှဝေရန် ခလုတ်နှိပ်ပြီးပါက ဆာဗာသို့ တည်နေရာ தொடர்ந்து ပို့ပေးမည် (ဖုန်း screen ပိတ်ထားလည်း background တွင် အလုပ်လုပ်မည်)
                if (isSharing) {
                    socket.emit('liveLocationUpdate', { lat: lat, lng: lng });
                }
            }, (error) => {
                console.error("Passenger GPS Error: " + error.message);
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        function startSharing() {
            if (navigator.geolocation) {
                isSharing = true;
                document.getElementById('status').innerText = "အခြေအနေ: တည်နေရာ မျှဝေနေပါပြီ";
                
                navigator.geolocation.getCurrentPosition((position) => {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    socket.emit('liveLocationUpdate', { lat: lat, lng: lng });
                });
            } else {
                alert("ဒီဘရောက်ဇာမှ တည်နေရာရှာဖွေမှုကို မထောက်ပံ့ပါ။");
            }
        }

        // ယာဉ်မောင်းမှ လက်ခံကြောင်း စာသားပြသခြင်း
        socket.on('rideAccepted', (data) => {
            document.getElementById('status').innerText = data.message;
        });

        // ယာဉ်မောင်း တည်နေရာ ရွေ့လျားမှုကို အနီရောင်မားကာဖြင့် ခရီးသည်ဘက်တွင် ပြသခြင်း
        socket.on('driverLocationUpdate', (data) => {
            if (!driverMarker) {
                driverMarker = L.marker([data.lat, data.lng], { icon: redIcon })
                    .addTo(map)
                    .bindPopup(`<b>ယာဉ်မောင်း လာနေပါပြီ</b><br><span style="font-size:12px; color:gray;">Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)}</span>`)
                    .openPopup();
            } else {
                driverMarker.setLatLng([data.lat, data.lng]);
                driverMarker.setPopupContent(`<b>ယာဉ်မောင်း လာနေပါပြီ</b><br><span style="font-size:12px; color:gray;">Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)}</span>`);
            }
        });

        // ရောက်ရှိလာပါက အသံမြည်ခြင်း
        socket.on('driverArrived', (data) => {
            playAlertVoice("ကားဆရာ ရောက်ရှိပါပြီ");
            document.getElementById('status').innerText = "ကားဆရာ ရောက်ရှိပါပြီ!";
        });

        socket.on('rideFinished', (data) => {
            if (driverMarker) {
                map.removeLayer(driverMarker);
                driverMarker = null;
            }
            document.getElementById('status').innerText = "ခရီးစဉ် ပြီးဆုံးသွားပါပြီ။";
        });
    </script>
</body>
</html>
