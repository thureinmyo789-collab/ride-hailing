<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ခရီးသည် တည်နေရာပို့ပေးခြင်း</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; text-align: center; }
        #map { height: 60vh; width: 100%; }
        .panel { padding: 15px; background: #fff; max-height: 35vh; overflow-y: auto; }
        button { padding: 10px 15px; font-size: 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        #status { font-weight: bold; margin-top: 10px; color: #333; }
        #coords { font-size: 14px; color: #555; margin-top: 5px; }
        .search-box { margin-bottom: 10px; }
        .search-box input { padding: 8px; width: 70%; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .driver-card { display: flex; align-items: center; background: #f9f9f9; border: 1px solid #ddd; padding: 10px; margin-top: 8px; border-radius: 8px; text-align: left; }
        .driver-card img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
        .driver-info { flex-grow: 1; font-size: 13px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="destinationInput" placeholder="သွားမည့်နေရာ (သို့) ဟိုတယ်နာမည် ရိုက်ထည့်ပါ...">
            <button onclick="searchDestination()">ရှာမည်</button>
        </div>
        <!-- တည်နေရာ မျှဝေမည် ခလုတ်ကို ဖြုတ်ပြီး တည်နေရာရှာဖွေသည့် ခလုတ်ထည့်သွင်းထားသည် -->
        <button id="locate-btn" onclick="checkAndGetLocation()">📍 မိမိတည်နေရာ ရှာမည်</button>
        <div id="status">အခြေအနေ: တည်နေရာ မပို့ရသေးပါ</div>
        <div id="coords">Lat: -, Lng: -</div>
        <div id="driversList"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        var map = L.map('map').setView([21.9833, 100.0833], 15);

        // Google Hybrid Map (ဂြိုလ်တုပုံရိပ် + လမ်းနှင့် နေရာအမည်များ)
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        var socket = io();
        var myMarker = null;
        var driverMarker = null;
        var destMarker = null;
        var isSharing = false;
        var currentLat = null;
        var currentLng = null;
        var destLat = null;
        var destLng = null;

        // ယာဉ်မောင်းအတွက် အနီရောင် မားကာ
        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        function playAlertVoice(text) {
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'my-MM';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ခရီးသည် တည်နေရာ အပ်ဒိတ်လုပ်ရန် သီးသန့် ဖန်တီးထားသော လုပ်ဆောင်ချက်
        function updatePassengerMarker(lat, lng) {
            currentLat = lat;
            currentLng = lng;

            if (!myMarker) {
                myMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}</span>`).openPopup();
                map.setView([currentLat, currentLng], 17);
            } else {
                myMarker.setLatLng([currentLat, currentLng]);
                myMarker.setPopupContent(`<b>သင့်တည်နေရာ (ခရီးသည်)</b><br><span style="font-size:12px; color:gray;">Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}</span>`);
            }

            document.getElementById('coords').innerText = `Lat: ${currentLat.toFixed(4)}, Lng: ${currentLng.toFixed(4)}`;

            // ယာဉ်မောင်းခေါ်ပြီးမှသာ (`isSharing = true`) တည်နေရာကို ယာဉ်မောင်းဆီသို့ တိုက်ရိုက်ပို့မည်
            if (isSharing) {
                socket.emit('liveLocationUpdate', { lat: currentLat, lng: currentLng, destLat: destLat, destLng: destLng });
            }
        }

        // တည်နေရာ (GPS) ရယူရန်နှင့် စစ်ဆေးရန် လုပ်ဆောင်ချက်
        function checkAndGetLocation() {
            if (!navigator.geolocation) {
                alert("သင့်ဘရောက်ဇာသည် တည်နေရာကို မထောက်ပံ့ပါ။");
                return;
            }

            // ပထမဦးစွာ တည်နေရာ ရယူနိုင်ခြင်း ရှိမရှိ စစ်ဆေးခြင်း
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    updatePassengerMarker(lat, lng);
                },
                (error) => {
                    if (error.code === error.PERMISSION_DENIED || error.code === error.POSITION_UNAVAILABLE) {
                        let openSettings = confirm("ကျေးဇူးပြု၍ ဖုန်း၏ Location (GPS) ကို ဖွင့်ပါ။");
                        if (openSettings) {
                            // အသုံးပြုသူအား လိုအပ်ပါက ဆက်တင်ဖွင့်ရန် အသိပေးခြင်း
                        }
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );

            // နောက်ခံတွင် တည်နေရာကို အမြဲတမ်း စောင့်ကြည့်နေမည်
            navigator.geolocation.watchPosition((position) => {
                updatePassengerMarker(position.coords.latitude, position.coords.longitude);
            }, (error) => {
                console.error("Passenger GPS Error: " + error.message);
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        // စာမျက်နှာ စတင်ဖွင့်လှစ်သည်နှင့် Location စစ်ဆေးရန် ခေါ်ယူခြင်း
        window.onload = () => {
            checkAndGetLocation();
        };

        // မြေပုံပေါ်တွင် နေရာထောက်၍ သွားမည့်နေရာ သတ်မှတ်ခြင်း
        map.on('click', function(e) {
            destLat = e.latlng.lat;
            destLng = e.latlng.lng;
            if (!destMarker) {
                destMarker = L.marker([destLat, destLng], {draggable: true}).addTo(map).bindPopup("သွားမည့်နေရာ").openPopup();
            } else {
                destMarker.setLatLng([destLat, destLng]);
            }
            fetchDrivers();
        });

        // Search ဖြင့် နေရာရှာဖွေခြင်း (Nominatim API)
        function searchDestination() {
            let query = document.getElementById('destinationInput').value;
            if (!query) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        destLat = parseFloat(data[0].lat);
                        destLng = parseFloat(data[0].lon);
                        map.setView([destLat, destLng], 16);
                        if (!destMarker) {
                            destMarker = L.marker([destLat, destLng]).addTo(map).bindPopup(data[0].display_name).openPopup();
                        } else {
                            destMarker.setLatLng([destLat, destLng]).setPopupContent(data[0].display_name).openPopup();
                        }
                        fetchDrivers();
                    } else {
                        alert("မတွေ့ရှိပါ။ အခြားအမည်ဖြင့် ထပ်ရှာပါ။");
                    }
                });
        }

        // ဆာဗာမှ ယာဉ်မောင်းစာရင်း ထုတ်ယူပြသခြင်း
        function fetchDrivers() {
            fetch('/api/drivers')
                .then(res => res.json())
                .then(drivers => {
                    let listDiv = document.getElementById('driversList');
                    listDiv.innerHTML = "<h4>ယာဉ်မောင်း ရွေးချယ်ရန်</h4>";
                    drivers.forEach(d => {
                        listDiv.innerHTML += `
                            <div class="driver-card">
                                <img src="${d.image}" alt="Driver">
                                <div class="driver-info">
                                    <b>${d.name}</b><br>
                                    ဖုန်း: <a href="tel:${d.phone}">${d.phone}</a><br>
                                    ကား: ${d.car}
                                </div>
                                <button onclick="selectDriver('${d.phone}', '${d.name}', '${d.car}')">ကားဆရာခေါ်မည်</button>
                            </div>
                        `;
                    });
                });
        }

        function selectDriver(phone, name, car) {
            if (!currentLat || !currentLng) {
                alert("သင့်လက်ရှိ တည်နေရာ မရသေးပါ။ ခဏစောင့်ပါ။");
                return;
            }
            // ကားခေါ်မှသာ တည်နေရာ စတင်မျှဝေမည်
            isSharing = true;
            document.getElementById('status').innerText = "အခြေအနေ: တည်နေရာ မျှဝေနေပါပြီ (" + name + " ကို ခေါ်ဆိုနေသည်)";
            
            socket.emit('passengerRequestRide', {
                lat: currentLat,
                lng: currentLng,
                destLat: destLat,
                destLng: destLng,
                driverPhone: phone,
                driverName: name,
                carInfo: car
            });
            alert(name + " ထံသို့ ကားခေါ်ဆိုမှု ပို့လိုက်ပါပြီ။");
        }

        // ယာဉ်မောင်းမှ လက်ခံကြောင်း စာသားပြသခြင်း
        socket.on('rideAccepted', (data) => {
            document.getElementById('status').innerText = data.message;
            playAlertVoice("ယာဉ်မောင်းမှ ခရီးစဉ်ကို လက်ခံလိုက်ပါပြီ");
        });

        // ယာဉ်မောင်း တည်နေရာ ရွေ့လျားမှုကို အနီရောင်မားကာဖြင့် ခရီးသည်ဘက်တွင် ပြသခြင်း
        socket.on('driverLocationUpdate', (data) => {
            if (!driverMarker) {
                driverMarker = L.marker([data.lat, data.lng], { icon: redIcon })
                    .addTo(map)
                    .bindPopup(`<b>ယာဉ်မောင်း တည်နေရာ</b><br><span style="font-size:12px; color:gray;">Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)}</span>`)
                    .openPopup();
            } else {
                driverMarker.setLatLng([data.lat, data.lng]);
                driverMarker.setPopupContent(`<b>ယာဉ်မောင်း တည်နေရာ</b><br><span style="font-size:12px; color:gray;">Lat: ${data.lat.toFixed(4)}, Lng: ${data.lng.toFixed(4)}</span>`);
            }
        });

        // ရောက်ရှိလာပါက အသံမြည်ခြင်း
        socket.on('driverArrived', (data) => {
            playAlertVoice("ကားဆရာ ရောက်ရှိပါပြီ");
            document.getElementById('status').innerText = "ကားဆရာ ရောက်ရှိပါပြီ!";
        });

        // ယာဉ်မောင်းဘက်မှ ခရီးစဉ် ပြီးဆုံးပါက တည်နေရာမျှဝေမှု ရပ်ဆိုင်းခြင်း
        socket.on('rideFinished', (data) => {
            isSharing = false; // တည်နေရာ မျှဝေမှုကို ရပ်လိုက်မည်
            if (driverMarker) {
                map.removeLayer(driverMarker);
                driverMarker = null;
            }
            document.getElementById('status').innerText = "ခရီးစဉ် ပြီးဆုံးသွားပါပြီ။";
        });
    </script>
</body>
</html>
